[project]
name = "petstore-orders"
version = "0.1.0"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "anyio>=4.11",
  "fastapi",
  "pillow>=12",
  "pymongo>=4.15.4",
  "python-dotenv>=1.2.1",
  "redis>=7.1",
  "uvicorn",
]

[dependency-groups]
dev = [
  "docker>=7.1",
  "httpx>=0.28.1",
  "pre-commit",
  "pytest",
  "pytest-asyncio>=1.3",
  "requests>=2.32.5",
  "ruff",
  "ty>=0.0.1a27",
]
internal = [
  "petstore",
]

[tool.ruff]
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D203",
  "D211",
  "D212",
  "INP001",
  "PT013",
  "S101",
]
lint.fixable = [ "ALL" ]

[tool.uv.sources]
petstore = { workspace = true }

[tool.uv.workspace]
members = [ "services/*" ]

[tool.uv]
default-groups = [ "dev", "internal" ]
