fail_fast: true
repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.8
    hooks:
      - id: uv-lock
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.8.0
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --unsafe-fixes]
        require_serial: true
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.8
    hooks:
      - id: actionlint
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        exclude_types:
          - xml
  - repo: local
    hooks:
      - id: toml-format
        name: Format toml using taplo
        entry: taplo fmt
        exclude: pyproject.toml
        types:
          - toml
        language: rust
        additional_dependencies:
          - cli:taplo-cli
      - id: toml-lint
        name: Lint toml using taplo
        entry: taplo lint
        types:
          - toml
        language: rust
        additional_dependencies:
          - cli:taplo-cli
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --no-active ty check . --ignore unresolved-import
        language: python
        additional_dependencies:
          - uv
  - repo: local
    hooks:
      - id: pytest-collect-only
        name: assert test collection works
        entry: uv run --no-active pytest --collect-only
        language: python
        pass_filenames: false
        additional_dependencies:
          - uv
  - repo: meta
    hooks:
      - id: check-useless-excludes
      - id: check-hooks-apply
